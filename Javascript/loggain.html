<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in och registrera dig</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="styleloggain.css">
</head>

<body>
    <div class="back-link-wrap"><a href="index.html">← Tillbaka till startsidan</a></div>
    <main class="main-content main-content--forms">
        <div class="forms-container">
            <div class="form-container">
                <h2>Logga in</h2>
                <form id="login-form">
                    <label for="username">Användarnamn:</label>
                    <input type="text" id="username" name="username" required>
                    <label for="password">Lösenord:</label>
                    <input type="password" id="password" name="password" required>
                    <button type="submit">Logga in</button>
                </form>
            </div>
            <div class="form-container">
                <h2>Registrera dig</h2>
                <form id="register-form">
                    <label for="new-username">Användarnamn:</label>
                    <input type="text" id="new-username" name="new-username" required>
                    <label for="new-password">Lösenord:</label>
                    <input type="password" id="new-password" name="new-password" required>
                    <button type="submit">Registrera dig</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p>Allt material är upphovsrättsskyddat © 2023</p>
    </footer>
    <script src="script1.js"></script>
</body>

</html>
